services:
  # Self-hosted Whisper speech-to-text microservice (FastAPI + faster-whisper).
  - type: web
    name: alafia-whisper
    runtime: python
    rootDir: whisper-service
    # 2 GB RAM: the `small` model needs ~1 GB+ resident. Free/Starter (512 MB) will OOM.
    plan: standard
    numInstances: 1 # all requests must share one model instance; do not scale without a queue
    healthCheckPath: /health
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "import os; from faster_whisper import WhisperModel; WhisperModel(os.environ.get('WHISPER_MODEL', 'small'), device='cpu', compute_type='int8')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      # Pin 3.12: Render defaults new services to 3.14, where ctranslate2/av
      # wheels may not be published yet.
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: WHISPER_MODEL
        value: small # budget fallback: base (lower accuracy, fits 512 MB plans)
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      # Shared secret with the Node backend. Required once this service is
      # publicly reachable; set the same value in the backend's environment.
      - key: WHISPER_SERVICE_TOKEN
        sync: false
      - key: MAX_UPLOAD_MB
        value: 25
      - key: LOG_LEVEL
        value: INFO
